version: 1
name: 05-Plugin/NcclPlugin
# Disabled: needs a multi-GPU NCCL launch (mpirun / several ranks), which the
# single-process runner cannot provide. Run it by hand on a multi-GPU box.
enabled: false
tags:
  - plugin
run:
  - make build > /dev/null 2>&1
  - python3 main.py > log-main.py.log
clean:
  - make clean
  - rm -rf *.log
