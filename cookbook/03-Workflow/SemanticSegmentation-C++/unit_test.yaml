version: 1
name: 03-Workflow/SemanticSegmentation-C++
enabled: true
tags:
  - workflow
  - cpp
  - onnx
pre:
  - make build
run:
  - python3 export.py > log-export.py.log 2>&1
  - ./main.exe        > log-main.exe.log 2>&1
  - python3 check.py  > log-check.py.log 2>&1
clean:
  - rm -rf *.d *.o *.exe *.log *.onnx *.ppm *.raw *.npy
