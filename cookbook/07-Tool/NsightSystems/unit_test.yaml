version: 1
name: 07-Tool/NsightSystems
enabled: true
tags:
  - tool
# `nsys` was found hanging on this machine on 2026-09-07 for ANY target, including
# `nsys profile -o /tmp/x /bin/true` -- idle GPU, empty log, no report, and it survives the
# runner giving up (an orphaned nsys kept sleeping for ~57 min after a 1800 s timeout).
# The short timeout bounds the damage in a full sweep; if this case times out, check
# `pgrep -af nsys` and kill leftovers before trusting later timings.
timeout: 300
run:
  - chmod +x main.sh
  - ./main.sh
  # Read the report from code instead of from `nsys-ui`: export to SQLite and query it.
  - python3 main.py > log-main.py.log 2>&1
  - nsys --help > Help.txt 2>&1
  - nsys analyze --help > Help-analyze.txt 2>&1
  - nsys cancel --help > Help-cancel.txt 2>&1
  - nsys export --help > Help-export.txt 2>&1
  - nsys profile --help > Help-profile.txt 2>&1
  - nsys launch --help > Help-launch.txt 2>&1
  - nsys stop --help > Help-stop.txt 2>&1
  - nsys service --help > Help-service.txt 2>&1
  - nsys stats --help > Help-stats.txt 2>&1
  - nsys shutdown --help > Help-shutdown.txt 2>&1
  - nsys sessions list --help > Help-sessions-list.txt 2>&1
  - nsys recipe --help > Help-recipe.txt 2>&1
clean:
  - rm -rf *.log *.onnx *.nsys-rep *.qdrep *.qdrep-nsys *.trt *.txt *.sqlite
