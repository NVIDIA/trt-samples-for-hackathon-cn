version: 1
name: 07-Tool/EnginePrinter
enabled: true
tags:
  - tool
  - engineprinter
run:
  - python3 main.py > log-main.py.log 2>&1
  - TRT_COOKBOOK_ENGINE_INTERNAL=1 python3 main.py > log-main.py-internal.log 2>&1
  - TRT_COOKBOOK_ENGINE_INTERNAL=1 python3 check_against_api.py > log-check_against_api.py.log 2>&1
clean:
  - rm -rf *.trt
